<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">V85 pipeline</title>
  <desc id="d">Public race data becomes point-in-time features, a horse model gives calibrated win chances, these are compared with the crowd's betting, and a pool engine suggests a system or a skip. A walk-forward backtest and an experiment registry check every step.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.5;rx:10}
      .blue{fill:#E6F1F8;stroke:#0072B2}
      .orange{fill:#FDF3E1;stroke:#E69F00}
      .h{font-size:15px;font-weight:600;fill:#111}
      .s{font-size:12px;fill:#444}
      .ln{stroke:#555;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .ev{fill:#F4F4F4;stroke:#999;stroke-dasharray:5 4;rx:10}
    </style>
  </defs>
  <rect width="720" height="330" fill="#fff"/>
  <!-- row 1 -->
  <rect class="box" x="10" y="20" width="150" height="80" rx="10"/>
  <text class="h" x="85" y="52" text-anchor="middle">Race data</text>
  <text class="s" x="85" y="72" text-anchor="middle">ATG public API</text>
  <text class="s" x="85" y="88" text-anchor="middle">cached, 1 request/s</text>

  <rect class="box" x="195" y="20" width="150" height="80" rx="10"/>
  <text class="h" x="270" y="52" text-anchor="middle">Features</text>
  <text class="s" x="270" y="72" text-anchor="middle">~100 per horse</text>
  <text class="s" x="270" y="88" text-anchor="middle">known before the stop</text>

  <rect class="box blue" x="380" y="20" width="150" height="80" rx="10"/>
  <text class="h" x="455" y="52" text-anchor="middle">Horse model</text>
  <text class="s" x="455" y="72" text-anchor="middle">LightGBM, calibrated</text>
  <text class="s" x="455" y="88" text-anchor="middle">win chance per horse</text>

  <rect class="box" x="565" y="20" width="145" height="80" rx="10"/>
  <text class="h" x="637" y="52" text-anchor="middle">The crowd</text>
  <text class="s" x="637" y="72" text-anchor="middle">V85 % before</text>
  <text class="s" x="637" y="88" text-anchor="middle">the stop</text>

  <path class="ln" d="M160,60 H193"/>
  <path class="ln" d="M345,60 H378"/>
  <!-- row 2 -->
  <rect class="box orange" x="380" y="140" width="150" height="80" rx="10"/>
  <text class="h" x="455" y="172" text-anchor="middle">Value</text>
  <text class="s" x="455" y="192" text-anchor="middle">chance ÷ crowd %</text>
  <text class="s" x="455" y="208" text-anchor="middle">where the crowd is wrong</text>

  <rect class="box" x="195" y="140" width="150" height="80" rx="10"/>
  <text class="h" x="270" y="172" text-anchor="middle">Pool engine</text>
  <text class="s" x="270" y="192" text-anchor="middle">expected payout</text>
  <text class="s" x="270" y="208" text-anchor="middle">within a SEK budget</text>

  <rect class="box" x="10" y="140" width="150" height="80" rx="10"/>
  <text class="h" x="85" y="172" text-anchor="middle">System or skip</text>
  <text class="s" x="85" y="192" text-anchor="middle">suggestion only,</text>
  <text class="s" x="85" y="208" text-anchor="middle">placed by hand</text>

  <path class="ln" d="M455,100 V138"/>
  <path class="ln" d="M637,100 V180 H532"/>
  <path class="ln" d="M380,180 H347"/>
  <path class="ln" d="M195,180 H162"/>
  <!-- evaluation band -->
  <rect class="ev" x="10" y="250" width="700" height="66" rx="10"/>
  <text class="h" x="360" y="276" text-anchor="middle">Checked at every step</text>
  <text class="s" x="360" y="298" text-anchor="middle">walk-forward backtest · 95 % ranges · leakage tests · experiment registry · sealed live test</text>
</svg>
